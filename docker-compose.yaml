services:
  db:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/local-env.sh first}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?Run scripts/local-env.sh first}
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD:?Run scripts/local-env.sh first}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./local/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: arigaio/atlas:1.3.6@sha256:c7a07e78f968ea33e68f9912ea3337ab9d34ee0d21a2228e19c46163f2c1c4e0
    working_dir: /workspace
    environment:
      DATABASE_URL: postgres://app_migrator:${MIGRATOR_PASSWORD}@db:5432/app?sslmode=disable
    volumes:
      - ./atlas.hcl:/workspace/atlas.hcl:ro
      - ./migrations:/workspace/migrations:ro
    command: ["migrate", "apply", "--env", "local", "--revisions-schema", "atlas"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://app_runtime:${RUNTIME_PASSWORD}@db:5432/app?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/readyz', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 10
      start_period: 5s

  frontend:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"

volumes:
  postgres-data:
