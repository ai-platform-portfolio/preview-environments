name: Promote published release

on:
  workflow_dispatch:
    inputs:
      publication_run_id:
        description: Successful artifact publication run ID
        required: true
        type: string

      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]

      issue:
        description: Linear issue for the promotion PR (AI-123)
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write
  statuses: read

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GH_TOKEN: ${{ github.token }}
      PUBLICATION_RUN_ID: ${{ inputs.publication_run_id }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: true

      - name: Load successful publication record
        shell: bash
        run: |
          [[ "$PUBLICATION_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid run ID'; exit 1; }
          [[ "$(gh run view "$PUBLICATION_RUN_ID" --json conclusion,workflowName --jq '[.conclusion, .workflowName] | join("|")')" == 'success|Publish application artifacts' ]] || { echo 'Selected run is not a successful application publication'; exit 1; }
          mkdir -p "$RUNNER_TEMP/publication"
          gh run download "$PUBLICATION_RUN_ID" --pattern 'artifacts-*' --dir "$RUNNER_TEMP/publication"
          mapfile -t records < <(find "$RUNNER_TEMP/publication" -name artifacts.json -type f)
          [[ ${#records[@]} -eq 1 ]] || { echo 'Expected exactly one artifact record'; exit 1; }
          cp "${records[0]}" artifacts.json

      - run: python3 -m pip install PyYAML==6.0.3

      - name: Validate and pin release
        id: release
        run: python3 scripts/pin-environment.py

      - name: Require successful staging validation before production
        if: inputs.environment == 'production'
        env:
          REVISION: ${{ steps.release.outputs.revision }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          status="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REVISION/statuses" | jq -r --arg version "$VERSION" '[.[] | select(.context == "deployed-playwright-staging")][0] | select(.description | endswith("(" + $version + ")")) | .state // empty')"
          [[ "$status" == success ]] || { echo 'This release has no successful staging browser validation'; exit 1; }

      - name: Open promotion PR
        env:
          ISSUE: ${{ inputs.issue }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          [[ "$ISSUE" =~ ^AI-[1-9][0-9]*$ ]] || { echo 'Expected a Linear AI issue'; exit 1; }
          [[ -n "$(git status --porcelain -- "deploy/environments/$TARGET_ENVIRONMENT.yaml")" ]] || { echo 'Environment already pins this release'; exit 1; }
          branch="michaelalinks/${ISSUE,,}-${TARGET_ENVIRONMENT}-${PUBLICATION_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add "deploy/environments/$TARGET_ENVIRONMENT.yaml"
          git commit -m "$ISSUE: Pin $TARGET_ENVIRONMENT to $VERSION"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "$ISSUE: Promote $VERSION to $TARGET_ENVIRONMENT" \
            --body "Pins the published release from run $PUBLICATION_RUN_ID to $TARGET_ENVIRONMENT. Linear: $ISSUE. Merge deploys through the shared persistent ApplicationSet."
