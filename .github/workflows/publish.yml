name: Publish application artifacts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: artifacts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ATLAS_NO_ANON_TELEMETRY: 'true'
  ATLAS_NO_UPDATE_NOTIFIER: 'true'
  APPLICATION_CHART_REVISION: dfbadda25c42bf3b2d877036bf753aecfb435366 # 0.12.0

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      revision: ${{ steps.source.outputs.revision }}
      tag: ${{ steps.source.outputs.tag }}
      publish: ${{ steps.source.outputs.publish }}

    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
      PUBLISH: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - run: ./scripts/check-publication-source.sh

      - name: Select artifact revision and tag
        id: source
        shell: bash
        run: |
          tag=commit-$SOURCE_SHA
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            tag=preview-pr-$PR_NUMBER-$SOURCE_SHA
          fi

          echo "revision=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  validate:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.source.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ai-platform-portfolio/application-helm-chart
          ref: ${{ env.APPLICATION_CHART_REVISION }}
          path: .application-chart
          persist-credentials: false

      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.22.1

      # Same YAML parser as the existing platform validation tooling.
      - run: python3 -m pip install PyYAML==6.0.3

      - name: Test artifact and release handoff guards
        env:
          APPLICATION_CHART: .application-chart
        run: python3 -m unittest discover -s tests -p 'test_publication.py' -v

      - uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea
        with:
          version: v1.3.6
          cloud-token: ${{ needs.source.outputs.publish == 'true' && secrets.ATLAS_CLOUD_TOKEN || '' }}

      - name: Validate migration checksum and replay
        uses: ai-platform-portfolio/ops-shared/.github/actions/atlas-validate@7b7b2c3ab2552e5dc2fb7e954a090a63054981a4
        with:
          environment: local
          dev-url: docker://postgres/18.6/dev?search_path=public

      - name: Require Atlas CI bot for publishing
        if: needs.source.outputs.publish == 'true'
        env:
          ATLAS_CLOUD_TOKEN: ${{ secrets.ATLAS_CLOUD_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$ATLAS_CLOUD_TOKEN" ]]; then
            echo '::error::ATLAS_CLOUD_TOKEN must be available to this repository for Atlas validation and publication.'
            exit 1
          fi

      - name: Lint changed migrations
        if: needs.source.outputs.publish == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        shell: bash
        run: |
          # Git comparison also works before the first main Registry baseline exists.
          atlas migrate lint --config file://atlas.ci.hcl --env ci --git-base "$BASE_SHA"

      - name: Test migrations
        if: needs.source.outputs.publish == 'true'
        uses: ariga/atlas-action/migrate/test@be526fa360e6cb745546681470f4760dbbc49cf8
        with:
          config: file://atlas.ci.hcl
          env: ci

  frontend:
    needs: [source, validate]
    permissions:
      contents: read
      id-token: write

    uses: ai-platform-portfolio/ops-shared/.github/workflows/docker.yml@7ed775ef5c3077a99f49e859816ffc095c54d18a
    with:
      image: portfolio/preview-frontend
      context: frontend
      revision: ${{ needs.source.outputs.revision }}
      tag: ${{ needs.source.outputs.tag }}
      publish-preview: true
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  backend:
    needs: [source, validate]
    permissions:
      contents: read
      id-token: write

    uses: ai-platform-portfolio/ops-shared/.github/workflows/docker.yml@7ed775ef5c3077a99f49e859816ffc095c54d18a
    with:
      image: portfolio/preview-backend
      context: backend
      revision: ${{ needs.source.outputs.revision }}
      tag: ${{ needs.source.outputs.tag }}
      publish-preview: true
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  migrations:
    needs: [source, validate]
    if: needs.source.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      revision: ${{ steps.record.outputs.revision }}
      checksum: ${{ steps.record.outputs.checksum }}

    env:
      SOURCE_SHA: ${{ needs.source.outputs.revision }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - run: ./scripts/check-publication-source.sh

      - uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea
        with:
          version: v1.3.6
          cloud-token: ${{ secrets.ATLAS_CLOUD_TOKEN }}

      - name: Publish the matching migration directory
        uses: ariga/atlas-action/migrate/push@be526fa360e6cb745546681470f4760dbbc49cf8
        with:
          config: file://atlas.ci.hcl
          env: ci
          dir-name: preview-environments
          tag: ${{ env.SOURCE_SHA }}
          latest: ${{ github.event_name != 'pull_request' }}

      - name: Record published migration identity
        id: record
        shell: bash
        run: |
          git diff --exit-code -- migrations
          echo "revision=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "checksum=$(shasum -a 256 migrations/atlas.sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

  artifacts:
    needs: [source, frontend, backend, migrations]
    if: needs.source.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: read
      id-token: write

    env:
      SOURCE_SHA: ${{ needs.source.outputs.revision }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
      FRONTEND_IMAGE: ${{ needs.frontend.outputs.image }}
      FRONTEND_DIGEST: ${{ needs.frontend.outputs.digest }}
      FRONTEND_REVISION: ${{ needs.frontend.outputs.revision }}
      BACKEND_IMAGE: ${{ needs.backend.outputs.image }}
      BACKEND_DIGEST: ${{ needs.backend.outputs.digest }}
      BACKEND_REVISION: ${{ needs.backend.outputs.revision }}
      MIGRATION_REVISION: ${{ needs.migrations.outputs.revision }}
      MIGRATION_CHECKSUM: ${{ needs.migrations.outputs.checksum }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - run: ./scripts/write-artifact-record.sh

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ai-platform-portfolio/application-helm-chart
          ref: ${{ env.APPLICATION_CHART_REVISION }}
          path: .application-chart
          persist-credentials: false

      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.22.1

      - run: python3 -m pip install PyYAML==6.0.3

      - name: Generate complete release values
        id: values
        run: python3 scripts/write-release-values.py

      - uses: ai-platform-portfolio/ops-shared/.github/actions/acr-helm-login@1b56a382304c60e4bcfea11bb7bc6f789a14e8b2
        with:
          registry: localacrk8s
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Recheck immediately before publication and again before handing it off.
      - run: ./scripts/check-publication-source.sh

      - uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea
        with:
          version: v1.3.6
          cloud-token: ${{ secrets.ATLAS_CLOUD_TOKEN }}

      - name: Ensure the application's shared role-plan repository
        uses: ai-platform-portfolio/ops-shared/.github/actions/atlas-repository@41f6092ca6c9054a116da549406d3453eb0564e8
        with:
          name: ${{ steps.values.outputs.role-repository }}
          type: schema
          driver: postgres

      - run: ./scripts/check-publication-source.sh

      - name: Publish complete Helm release
        id: release
        uses: ai-platform-portfolio/ops-shared/.github/actions/publish-release@62b0185e9c21acadca8fe4250dbf64c262377a94
        with:
          chart: .application-chart
          values: ${{ steps.values.outputs.values }}
          destination: ${{ steps.values.outputs.destination }}
          version: ${{ steps.values.outputs.version }}
          revision: ${{ env.SOURCE_SHA }}

      - uses: ai-platform-portfolio/ops-shared/.github/actions/acr-lock@1b56a382304c60e4bcfea11bb7bc6f789a14e8b2
        with:
          registry: localacrk8s
          reference: ${{ steps.release.outputs.reference }}

      - name: Record published release identity
        env:
          RELEASE_REFERENCE: ${{ steps.release.outputs.reference }}
          RELEASE_DIGEST: ${{ steps.release.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          jq --arg reference "$RELEASE_REFERENCE" --arg digest "$RELEASE_DIGEST" \
            --arg chart "$APPLICATION_CHART_REVISION" \
            '.release = {reference: $reference, digest: $digest, chartRevision: $chart}' \
            artifacts.json > "$RUNNER_TEMP/artifacts.json"
          mv "$RUNNER_TEMP/artifacts.json" artifacts.json

      - run: ./scripts/check-publication-source.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: artifacts-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts.json
          if-no-files-found: error
          retention-days: 7
